<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="930" fill="#FFFFFF"/>
<text x="40" y="38" font-size="22" font-weight="bold" fill="#2C2C2A">Software stack: brazo robótico (ESP32 + 4 servos)</text>
<text x="40" y="62" font-size="13" fill="#5F5E5A">Capas de arriba (usuario) hacia abajo (hardware). Cada capa solo habla con la adyacente.</text>
<rect x="40" y="90" width="820" height="100" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="60" y="114" font-size="14" font-weight="bold" fill="#2C2C2A">1 · INTERFAZ DE USUARIO</text>
<rect x="60" y="128" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
<text x="180" y="148" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">App móvil</text>
<text x="180" y="166" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Botones HOME · AUTO · STOP</text>
<rect x="330" y="128" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
<text x="450" y="148" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Control manual</text>
<text x="450" y="166" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Un control por articulación</text>
<rect x="600" y="128" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
<text x="720" y="148" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Visor de estado</text>
<text x="720" y="166" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Ángulos, sensor, nivel de pila</text>
<line x1="450" y1="193" x2="450" y2="223" stroke="#2C2C2A" stroke-width="1.5"/>
<polygon points="445,215 455,215 450,223" fill="#2C2C2A"/>
<polygon points="445,201 455,201 450,193" fill="#2C2C2A"/>
<text x="466" y="212.0" font-size="11" fill="#5F5E5A">BLE / WiFi:  comandos ↓   estado ↑</text>
<rect x="40" y="226" width="820" height="100" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="60" y="250" font-size="14" font-weight="bold" fill="#2C2C2A">2 · COMUNICACIÓN</text>
<rect x="60" y="264" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text x="180" y="284" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Enlace inalámbrico</text>
<text x="180" y="302" font-size="11.5" text-anchor="middle" fill="#5F5E5A">BLE o WiFi del ESP32</text>
<rect x="330" y="264" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text x="450" y="284" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Parser de comandos</text>
<text x="450" y="302" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Valida y despacha cada comando</text>
<rect x="600" y="264" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text x="720" y="284" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Telemetría</text>
<text x="720" y="302" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Publica q1–q4, sensor y estado</text>
<line x1="450" y1="329" x2="450" y2="359" stroke="#2C2C2A" stroke-width="1.5"/>
<polygon points="445,351 455,351 450,359" fill="#2C2C2A"/>
<polygon points="445,337 455,337 450,329" fill="#2C2C2A"/>
<text x="466" y="348.0" font-size="11" fill="#5F5E5A">Comando validado ↓   estado ↑</text>
<rect x="40" y="362" width="820" height="118" rx="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="60" y="386" font-size="14" font-weight="bold" fill="#2C2C2A">3 · APLICACIÓN (LÓGICA DE LA TAREA)</text>
<rect x="60" y="400" width="240" height="66" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
<text x="180" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Máquina de estados</text>
<text x="180" y="438" font-size="11.5" text-anchor="middle" fill="#5F5E5A">IDLE · DETECTAR · RECOGER</text>
<text x="180" y="454" font-size="11.5" text-anchor="middle" fill="#5F5E5A">TRANSPORTAR · APILAR · ERROR</text>
<rect x="330" y="400" width="240" height="66" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
<text x="450" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Rutina pick &amp; place</text>
<text x="450" y="438" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Secuencia de waypoints</text>
<text x="450" y="454" font-size="11.5" text-anchor="middle" fill="#5F5E5A">(aproximar, bajar, agarrar...)</text>
<rect x="600" y="400" width="240" height="66" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
<text x="720" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Gestor de pila</text>
<text x="720" y="438" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Nivel k de la pila</text>
<text x="720" y="454" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Puntos de recogida P1–P3</text>
<line x1="450" y1="483" x2="450" y2="513" stroke="#2C2C2A" stroke-width="1.5"/>
<polygon points="445,505 455,505 450,513" fill="#2C2C2A"/>
<polygon points="445,491 455,491 450,483" fill="#2C2C2A"/>
<text x="466" y="502.0" font-size="11" fill="#5F5E5A">Puntos objetivo (x, y, z) ↓   fin de movimiento ↑</text>
<rect x="40" y="516" width="820" height="100" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="60" y="540" font-size="14" font-weight="bold" fill="#2C2C2A">4 · CONTROL DE MOVIMIENTO</text>
<rect x="60" y="554" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1"/>
<text x="180" y="574" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Planificador de trayectoria</text>
<text x="180" y="592" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Líneas rectas + perfil suave</text>
<rect x="330" y="554" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1"/>
<text x="450" y="574" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Cinemática D-H</text>
<text x="450" y="592" font-size="11.5" text-anchor="middle" fill="#5F5E5A">FK e IK analítica (ik_pos)</text>
<rect x="600" y="554" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1"/>
<text x="720" y="574" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Calibración</text>
<text x="720" y="592" font-size="11.5" text-anchor="middle" fill="#5F5E5A">q → ángulo de servo (signo + offset)</text>
<line x1="450" y1="619" x2="450" y2="649" stroke="#2C2C2A" stroke-width="1.5"/>
<polygon points="445,641 455,641 450,649" fill="#2C2C2A"/>
<polygon points="445,627 455,627 450,619" fill="#2C2C2A"/>
<text x="466" y="638.0" font-size="11" fill="#5F5E5A">Ángulos q → PWM ↓   lecturas ↑</text>
<rect x="40" y="652" width="820" height="100" rx="14" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="60" y="676" font-size="14" font-weight="bold" fill="#2C2C2A">5 · DRIVERS (CAPA DE ABSTRACCIÓN DE HARDWARE)</text>
<rect x="60" y="690" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1"/>
<text x="180" y="710" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Driver de servos</text>
<text x="180" y="728" font-size="11.5" text-anchor="middle" fill="#5F5E5A">ESP32Servo · 4 canales PWM</text>
<rect x="330" y="690" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1"/>
<text x="450" y="710" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Driver de sensor</text>
<text x="450" y="728" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Distancia + umbral de presencia</text>
<rect x="600" y="690" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1"/>
<text x="720" y="710" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Control de pinza</text>
<text x="720" y="728" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Abrir / cerrar (servo 4)</text>
<line x1="450" y1="755" x2="450" y2="785" stroke="#2C2C2A" stroke-width="1.5"/>
<polygon points="445,777 455,777 450,785" fill="#2C2C2A"/>
<polygon points="445,763 455,763 450,755" fill="#2C2C2A"/>
<text x="466" y="774.0" font-size="11" fill="#5F5E5A">PWM · GPIO · I2C</text>
<rect x="40" y="788" width="820" height="100" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="60" y="812" font-size="14" font-weight="bold" fill="#2C2C2A">6 · PLATAFORMA Y HARDWARE</text>
<rect x="60" y="826" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="180" y="846" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">ESP32</text>
<text x="180" y="864" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Arduino core + FreeRTOS</text>
<rect x="330" y="826" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="450" y="846" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Actuadores</text>
<text x="450" y="864" font-size="11.5" text-anchor="middle" fill="#5F5E5A">4 servos: base, hombro, codo, pinza</text>
<rect x="600" y="826" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="720" y="846" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Sensor y potencia</text>
<text x="720" y="864" font-size="11.5" text-anchor="middle" fill="#5F5E5A">Fuente 5–6 V externa, GND común</text>
<rect x="890" y="90" width="290" height="798" rx="14" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1035" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">SERVICIOS TRANSVERSALES</text>
<text x="1035" y="131" font-size="11" text-anchor="middle" fill="#5F5E5A">(aplican a todas las capas)</text>
<rect x="905" y="148" width="260" height="106" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/>
<text x="1035" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Tareas FreeRTOS</text>
<text x="921" y="192" font-size="11.5" fill="#5F5E5A">• Comunicación (BLE/WiFi)</text>
<text x="921" y="210" font-size="11.5" fill="#5F5E5A">• Control de movimiento (~50 Hz)</text>
<text x="921" y="228" font-size="11.5" fill="#5F5E5A">• Lectura de sensor (~10 Hz)</text>
<text x="921" y="246" font-size="11.5" fill="#5F5E5A">• Cola de comandos entre tareas</text>
<rect x="905" y="270" width="260" height="106" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/>
<text x="1035" y="292" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Seguridad</text>
<text x="921" y="314" font-size="11.5" fill="#5F5E5A">• Límites articulares (qlim)</text>
<text x="921" y="332" font-size="11.5" fill="#5F5E5A">• Rechazo de puntos fuera de alcance</text>
<text x="921" y="350" font-size="11.5" fill="#5F5E5A">• Timeout si se pierde el enlace</text>
<text x="921" y="368" font-size="11.5" fill="#5F5E5A">• STOP de emergencia</text>
<rect x="905" y="392" width="260" height="88" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/>
<text x="1035" y="414" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Configuración (config.h)</text>
<text x="921" y="436" font-size="11.5" fill="#5F5E5A">• Longitudes L1, L2 y altura d1</text>
<text x="921" y="454" font-size="11.5" fill="#5F5E5A">• Límites y offsets por servo</text>
<text x="921" y="472" font-size="11.5" fill="#5F5E5A">• Pines y umbral del sensor</text>
<rect x="905" y="496" width="260" height="70" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/>
<text x="1035" y="518" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Depuración</text>
<text x="921" y="540" font-size="11.5" fill="#5F5E5A">• Log por Serial (115200)</text>
<text x="921" y="558" font-size="11.5" fill="#5F5E5A">• Registro de trayectoria</text>
</svg>